<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scholarship Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16233A; --sage:#3F8F5F; --sage-bg:#E5F3EA; --gold:#B8912A; --gold-bg:#FBF1DC;
  --rust:#C24A3B; --rust-bg:#FBE7E3; --blue:#3A5A8C; --blue-bg:#E7EDF7;
  --bg:#F5F6F8; --panel:#FFFFFF; --line:#E4E6EB; --text:#1E2430; --muted:#7C8494;
  --serif:"Source Serif 4",Georgia,serif; --sans:Inter,system-ui,-apple-system,sans-serif;
}
:root[data-theme="dark"]{ --bg:#11141A; --panel:#181C24; --line:#282E3A; --text:#E7E9EE; --muted:#8A90A0; --sage-bg:#173325; --gold-bg:#332A12; --rust-bg:#361F1B; --blue-bg:#1B2740; }
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13.5px;}
h1,h2,h3,.serif{font-family:var(--serif);}
button,select,input{font-family:var(--sans);}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

.shell{display:flex;min-height:100vh;}
.rail{width:56px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;flex-shrink:0;}
.rail .logo{width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:10px;}
.rail button{width:36px;height:36px;border:none;background:transparent;color:var(--muted);border-radius:8px;font-size:16px;}
.rail button.active{background:var(--sage-bg);color:var(--sage);}
.rail .spacer{flex:1;}
.rail .avatar{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}

.side{width:230px;background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;flex-shrink:0;transition:margin-left .2s;}
.side h1{font-size:17px;margin:0 6px 18px;font-weight:700;}
.side h1 span{color:var(--sage);}
.navgroup{margin-bottom:16px;}
.navgroup h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 6px 6px;font-weight:600;font-family:var(--sans);}
.navitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;color:var(--text);cursor:pointer;font-size:13px;}
.navitem:hover{background:var(--bg);}
.navitem.active{background:var(--sage-bg);color:var(--sage);font-weight:600;}
.navitem .ic{width:16px;text-align:center;display:inline-flex;}
.ic svg,.rail button svg,.logo svg,.btn svg,.star svg,.actions button svg,#deleteBtn svg{display:block;}
.star,.actions>button{display:inline-flex;align-items:center;justify-content:center;}
.rail button,.logo{display:flex;align-items:center;justify-content:center;}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px;}
.userchip{display:flex;align-items:center;gap:8px;padding:6px;}
.userchip .av{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.userchip b{display:block;font-size:12.5px;} .userchip span{color:var(--muted);font-size:11px;}
.miniBtn{border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 8px;border-radius:7px;font-size:12px;text-align:left;display:flex;gap:6px;align-items:center;}
.miniBtn:hover{background:var(--bg);}
input[type=file]{display:none;}

.main{flex:1;padding:22px 26px 60px;min-width:0;overflow-x:hidden;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.topbar h2{margin:0;font-size:21px;}
.topbar p{margin:2px 0 0;color:var(--muted);font-size:12.5px;}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 13px;border-radius:8px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.btn.primary{background:var(--sage);border-color:var(--sage);color:#fff;}
.btn:hover{opacity:.88;}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
@media (max-width:800px){.kpis{grid-template-columns:1fr 1fr;}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
.kpi span{color:var(--muted);font-size:12px;}
.kpi b{display:block;font-family:var(--serif);font-size:24px;margin-top:4px;}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:14px;border-bottom:1px solid var(--line);align-items:center;}
.filters input[type=text]{flex:1;min-width:180px;padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);}
.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);font-size:12.5px;}

.tablewrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:820px;}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600;}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
tbody tr:hover{background:var(--bg);}
.star{background:none;border:none;color:#D8D2BF;font-size:15px;cursor:pointer;}
.star.on{color:var(--gold);}
.uni b{display:block;font-size:13.2px;} .uni span{color:var(--muted);font-size:11.8px;}
.deg{font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;color:var(--muted);white-space:nowrap;}
.pill{font-size:11px;padding:3px 9px;border-radius:20px;white-space:nowrap;font-weight:600;}
.p-sage{background:var(--sage-bg);color:var(--sage);} .p-gold{background:var(--gold-bg);color:var(--gold);}
.p-rust{background:var(--rust-bg);color:var(--rust);} .p-blue{background:var(--blue-bg);color:var(--blue);}
.p-muted{background:var(--bg);color:var(--muted);}
.dl{font-family:var(--serif);font-size:12.8px;}
.actions{position:relative;}
.actions button{border:none;background:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px 8px;}
.menu{position:absolute;right:0;top:28px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:20;min-width:110px;display:none;}
.menu.show{display:block;}
.menu button{display:block;width:100%;text-align:left;padding:8px 12px;font-size:12.5px;color:var(--text);}
.menu button:hover{background:var(--bg);}
.foot{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:var(--muted);font-size:12px;flex-wrap:wrap;gap:8px;}
.empty{padding:50px 10px;text-align:center;color:var(--muted);}
.empty b{display:block;font-family:var(--serif);font-size:17px;color:var(--text);margin-bottom:5px;}

.overlay{position:fixed;inset:0;background:rgba(15,17,22,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:30px 14px;}
.overlay.show{display:flex;}
.modal{background:var(--panel);width:100%;max-width:640px;border-radius:12px;margin-bottom:40px;border:1px solid var(--line);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);border-radius:12px 12px 0 0;}
.modal-head h3{margin:0;font-size:17px;}
.modal-head button{background:none;border:none;font-size:19px;color:var(--muted);}
.modal-body{padding:18px 20px;display:grid;gap:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:520px){.grid2{grid-template-columns:1fr;}}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);margin-bottom:4px;font-weight:600;}
input[type=text],input[type=date],input[type=url],textarea,select.f{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);font-size:13px;}
textarea{min-height:54px;resize:vertical;font-family:var(--sans);}
fieldset{border:none;padding:0;margin:0;display:grid;gap:12px;}
legend{font-family:var(--serif);font-size:14.5px;padding:0 0 6px;border-bottom:1px solid var(--line);width:100%;margin-bottom:2px;}
.tasklist{display:flex;flex-direction:column;gap:6px;}
.task-row{display:flex;gap:8px;align-items:center;}
.task-row input[type=text]{flex:1;}
.task-row .rm{background:none;border:none;color:var(--rust);font-size:15px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:200;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media (max-width:760px){ .side{position:fixed;left:56px;top:0;bottom:0;z-index:60;transform:translateX(-100%);} .side.open{transform:translateX(0);box-shadow:8px 0 24px rgba(0,0,0,.15);} }
</style>
</head>
<body>
<div class="shell">
  <div class="rail">
    <div class="logo"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-1.5-1-4-1.5-7-1.5v13c3 0 5.5.5 7 1.5 1.5-1 4-1.5 7-1.5v-13c-3 0-5.5.5-7 1.5z"/><path d="M12 6v13"/></svg></div>
    <button class="active" id="railHome" title="Dashboard"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
    <button id="railMenu" title="Menu"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <div class="spacer"></div>
    <button id="themeBtn" title="Toggle theme"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></button>
    <div class="avatar">SA</div>
  </div>

  <aside class="side" id="side">
    <h1>Scholar<span>Atlas</span></h1>
    <div class="navgroup">
      <h4>Tracker</h4>
      <div class="navitem active"><span class="ic"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span> All opportunities</div>
      <div class="navitem" data-view="soon"><span class="ic"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span> Due soon</div>
      <div class="navitem" data-view="progress"><span class="ic"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg></span> In progress</div>
      <div class="navitem" data-view="accepted"><span class="ic"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg></span> Accepted</div>
    </div>
    <div class="navgroup">
      <h4>Data</h4>
      <div class="navitem" id="navExport"><span class="ic"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg></span> Export backup</div>
      <label class="navitem" style="margin:0;" for="importFile"><span class="ic"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 19h16"/></svg></span> Import backup</label>
      <input type="file" id="importFile" accept="application/json">
    </div>
    <div class="side-foot">
      <div class="userchip"><div class="av">YOU</div><div><b>Your applications</b><span>Stored only in this browser</span></div></div>
      <button class="miniBtn" id="resetBtn"><span class="ic"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg></span> Clear all data</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div><h2>Dashboard</h2><p id="subhead">Loading…</p></div>
      <button class="btn primary" id="addBtn"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add opportunity</button>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="panel">
      <div class="filters">
        <input type="text" id="search" placeholder="Search university, programme, field, notes…">
        <select id="fRegion"><option value="">Region: all</option></select>
        <select id="fCountry"><option value="">Country: all</option></select>
        <select id="fDegree"><option value="">Degree: any</option><option>Masters</option><option>PhD</option></select>
        <select id="fStatus"><option value="">Status: any</option></select>
        <select id="fSort"><option value="deadline">Sort: deadline</option><option value="added">Sort: recently added</option><option value="name">Sort: A–Z</option></select>
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr>
            <th></th><th>University / programme</th><th>Country</th><th>Degree</th><th>Deadline</th><th>Status</th><th></th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="foot"><span id="pageInfo"></span><span>ScholarAtlas · data never leaves this browser</span></div>
    </div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle">New entry</h3><button id="closeModal"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn" id="deleteBtn" style="border-color:var(--rust);color:var(--rust);"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg> Delete</button>
      <div style="display:flex;gap:8px;"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">Save entry</button></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY='scholarship_atlas_v2';
const ICON={
  star:(on)=>`<svg viewBox="0 0 24 24" width="15" height="15" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><polygon points="12 3 14.6 9 21 9.5 16.2 13.6 17.7 20 12 16.5 6.3 20 7.8 13.6 3 9.5 9.4 9"/></svg>`,
  kebab:`<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>`,
  x:`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>`,
  plus:`<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  trash:`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>`,
};
const REGIONS={
  'Africa':['Algeria','Angola','Benin','Botswana','Burkina Faso','Burundi','Cabo Verde','Cameroon','Central African Republic','Chad','Comoros','Congo (Brazzaville)','Congo (DRC)','Djibouti','Egypt','Equatorial Guinea','Eritrea','Eswatini','Ethiopia','Gabon','Gambia','Ghana','Guinea','Guinea-Bissau','Ivory Coast','Kenya','Lesotho','Liberia','Libya','Madagascar','Malawi','Mali','Mauritania','Mauritius','Morocco','Mozambique','Namibia','Niger','Nigeria','Rwanda','Sao Tome and Principe','Senegal','Seychelles','Sierra Leone','Somalia','South Africa','South Sudan','Sudan','Tanzania','Togo','Tunisia','Uganda','Zambia','Zimbabwe'],
  'Asia':['Afghanistan','Armenia','Azerbaijan','Bahrain','Bangladesh','Bhutan','Brunei','Cambodia','China','Cyprus','Georgia','India','Indonesia','Iran','Iraq','Israel','Japan','Jordan','Kazakhstan','Kuwait','Kyrgyzstan','Laos','Lebanon','Malaysia','Maldives','Mongolia','Myanmar','Nepal','North Korea','Oman','Pakistan','Palestine','Philippines','Qatar','Saudi Arabia','Singapore','South Korea','Sri Lanka','Syria','Taiwan','Tajikistan','Thailand','Timor-Leste','Turkey','Turkmenistan','United Arab Emirates','Uzbekistan','Vietnam','Yemen'],
  'Europe':['Albania','Andorra','Austria','Belarus','Belgium','Bosnia and Herzegovina','Bulgaria','Croatia','Czech Republic','Denmark','Estonia','Finland','France','Germany','Greece','Hungary','Iceland','Ireland','Italy','Kosovo','Latvia','Liechtenstein','Lithuania','Luxembourg','Malta','Moldova','Monaco','Montenegro','Netherlands','North Macedonia','Norway','Poland','Portugal','Romania','Russia','San Marino','Serbia','Slovakia','Slovenia','Spain','Sweden','Switzerland','Ukraine','United Kingdom','Vatican City'],
  'North America':['Antigua and Barbuda','Bahamas','Barbados','Belize','Canada','Costa Rica','Cuba','Dominica','Dominican Republic','El Salvador','Grenada','Guatemala','Haiti','Honduras','Jamaica','Mexico','Nicaragua','Panama','Saint Kitts and Nevis','Saint Lucia','Saint Vincent and the Grenadines','Trinidad and Tobago','United States'],
  'South America':['Argentina','Bolivia','Brazil','Chile','Colombia','Ecuador','Guyana','Paraguay','Peru','Suriname','Uruguay','Venezuela'],
  'Oceania':['Australia','Fiji','Kiribati','Marshall Islands','Micronesia','Nauru','New Zealand','Palau','Papua New Guinea','Samoa','Solomon Islands','Tonga','Tuvalu','Vanuatu'],
};
const STATUSES=['Not Started','In Progress','Submitted','Interview','Accepted','Rejected'];
const PILL={'Not Started':'p-muted','In Progress':'p-sage','Submitted':'p-blue','Interview':'p-gold','Accepted':'p-sage','Rejected':'p-rust'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

let data = load();
let state = { view:'all', search:'', region:'', country:'', degree:'', status:'', sort:'deadline' };

function load(){ try{ const raw=localStorage.getItem(KEY); return raw? JSON.parse(raw): seed(); }catch(e){ return seed(); } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){ toast('Storage error — not saved'); } }
function seed(){
  return [{
    id:uid(), pinned:true, region:'Europe', country:'Germany', university:'Technical University of Munich',
    program:'M.Sc. Data Engineering & Analytics', degree:'Masters', field:'Computer Science', scholarship:'DAAD EPOS Scholarship',
    funding:'Full tuition waiver + €934/month stipend + travel allowance + health insurance',
    eligibility:'Bachelor\'s degree; min 2 yrs relevant work experience for EPOS; age limit may apply',
    academicReq:'Min 16 years of education, strong quantitative background', englishReq:'IELTS 6.5 / TOEFL iBT 90',
    research:'Not mandatory for taught Master\'s; recommended to identify a thesis advisor early',
    documents:['CV','Motivation letter','2 reference letters','Transcripts','Language certificate'],
    deadline:'', source:'https://www.daad.de', pakEligible:'Yes — DAAD lists Pakistan as an eligible developing country',
    myStatus:'Eligible — need updated IELTS score', appStatus:'Not Started',
    tasks:[{text:'Retake IELTS', done:false},{text:'Draft motivation letter', done:false}],
    notes:'Example starter entry — edit or delete freely.', added:new Date().toISOString()
  }];
}
function daysUntil(d){ if(!d) return null; const t=new Date(d), n=new Date(); n.setHours(0,0,0,0); return Math.round((t-n)/86400000); }
function esc(s){ return (s||'').toString().replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

function filtered(){
  let arr=[...data];
  if(state.view==='soon') arr=arr.filter(d=>{const n=daysUntil(d.deadline); return n!==null&&n>=0&&n<=30;});
  if(state.view==='progress') arr=arr.filter(d=>['In Progress','Submitted','Interview'].includes(d.appStatus));
  if(state.view==='accepted') arr=arr.filter(d=>d.appStatus==='Accepted');
  if(state.region) arr=arr.filter(d=>d.region===state.region);
  if(state.country) arr=arr.filter(d=>d.country===state.country);
  if(state.degree) arr=arr.filter(d=>d.degree===state.degree);
  if(state.status) arr=arr.filter(d=>d.appStatus===state.status);
  if(state.search){ const q=state.search.toLowerCase(); arr=arr.filter(d=>[d.university,d.program,d.field,d.scholarship,d.notes,d.country].join(' ').toLowerCase().includes(q)); }
  if(state.sort==='deadline') arr.sort((a,b)=>(a.deadline||'9999')<(b.deadline||'9999')?-1:1);
  else if(state.sort==='added') arr.sort((a,b)=>b.added.localeCompare(a.added));
  else arr.sort((a,b)=>a.university.localeCompare(b.university));
  arr.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
  return arr;
}

function renderKpis(){
  const total=data.length;
  const soon=data.filter(d=>{const n=daysUntil(d.deadline); return n!==null&&n>=0&&n<=30;}).length;
  const active=data.filter(d=>['In Progress','Submitted','Interview'].includes(d.appStatus)).length;
  const won=data.filter(d=>d.appStatus==='Accepted').length;
  document.getElementById('kpis').innerHTML=`
    <div class="kpi"><span>Total tracked</span><b>${total}</b></div>
    <div class="kpi"><span>Deadlines ≤30d</span><b style="color:var(--gold)">${soon}</b></div>
    <div class="kpi"><span>Applications in motion</span><b>${active}</b></div>
    <div class="kpi"><span>Accepted</span><b style="color:var(--sage)">${won}</b></div>`;
}
function renderFilters(){
  document.getElementById('fRegion').innerHTML='<option value="">Region: all</option>'+Object.keys(REGIONS).map(r=>`<option ${state.region===r?'selected':''}>${r}</option>`).join('');
  const countryList = state.region ? REGIONS[state.region] : Object.values(REGIONS).flat().sort();
  document.getElementById('fCountry').innerHTML='<option value="">Country: all</option>'+countryList.map(c=>`<option ${state.country===c?'selected':''}>${c}</option>`).join('');
  document.getElementById('fStatus').innerHTML='<option value="">Status: any</option>'+STATUSES.map(s=>`<option ${state.status===s?'selected':''}>${s}</option>`).join('');
}
function renderTable(){
  const arr=filtered();
  const titles={all:'All opportunities',soon:'Due within 30 days',progress:'Applications in progress',accepted:'Accepted offers'};
  document.getElementById('subhead').textContent=`${arr.length} programme${arr.length===1?'':'s'} · ${titles[state.view]}`;
  const tb=document.getElementById('tbody');
  if(!arr.length){ tb.innerHTML=`<tr><td colspan="7"><div class="empty"><b>Nothing here yet</b>Add an opportunity or adjust your filters.</div></td></tr>`; document.getElementById('pageInfo').textContent=''; return; }
  tb.innerHTML=arr.map(d=>{
    const n=daysUntil(d.deadline); let dtxt=d.deadline||'—', col='';
    if(n!==null){ if(n<0){col='color:var(--rust)';dtxt='Passed';} else if(n<=30){col='color:var(--gold);font-weight:700';dtxt=n+'d left';} }
    return `<tr data-id="${d.id}">
      <td><button class="star ${d.pinned?'on':''}" data-act="pin">${ICON.star(d.pinned)}</button></td>
      <td class="uni"><b>${esc(d.university)}</b><span>${esc(d.program)}</span></td>
      <td>${esc(d.country)}</td>
      <td><span class="deg">${d.degree}</span></td>
      <td class="dl" style="${col}">${esc(dtxt)}</td>
      <td><span class="pill ${PILL[d.appStatus]}">${d.appStatus}</span></td>
      <td class="actions"><button data-act="menu">${ICON.kebab}</button>
        <div class="menu" id="menu-${d.id}"><button data-act="edit">Edit</button><button data-act="delete">Delete</button></div>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('pageInfo').textContent=`Showing 1–${arr.length} of ${arr.length}`;
  tb.querySelectorAll('tr[data-id]').forEach(row=>{
    const id=row.dataset.id;
    row.querySelector('[data-act="pin"]').onclick=(e)=>{e.stopPropagation(); const d=data.find(x=>x.id===id); d.pinned=!d.pinned; save(); renderTable();};
    row.querySelector('[data-act="menu"]').onclick=(e)=>{e.stopPropagation(); document.querySelectorAll('.menu').forEach(m=>m.classList.remove('show')); document.getElementById('menu-'+id).classList.toggle('show');};
    row.querySelector('[data-act="edit"]').onclick=(e)=>{e.stopPropagation(); openModal(id);};
    row.querySelector('[data-act="delete"]').onclick=(e)=>{e.stopPropagation(); if(confirm('Delete this entry permanently?')){data=data.filter(x=>x.id!==id);save();renderAll();toast('Entry deleted');}};
    row.querySelector('.uni').onclick=()=>openModal(id);
  });
}
document.addEventListener('click',()=>document.querySelectorAll('.menu').forEach(m=>m.classList.remove('show')));
function renderAll(){ renderKpis(); renderFilters(); renderTable(); }

const fieldDefs=[
 ['university','text','University'],['program','text','Programme / degree title'],
 ['region','select-region','Region'],['country','select-country','Country'],
 ['degree','select-degree','Degree level'],['field','text','Field of study'],
 ['scholarship','text','Scholarship / funding name'],
 ['funding','textarea','Funding coverage (tuition, stipend, travel, insurance…)'],
 ['eligibility','textarea','Eligibility criteria'],
 ['academicReq','textarea','Academic & technical requirements'],
 ['englishReq','text','English-language requirement'],
 ['research','textarea','Research expectations'],
 ['deadline','date','Application deadline'],
 ['source','url','Official source URL'],
 ['pakEligible','textarea','Pakistani eligibility notes'],
 ['myStatus','textarea','My eligibility / status'],
 ['appStatus','select-status','My application status'],
 ['notes','textarea','Research notes'],
];
function openModal(id){
  const d=id? data.find(x=>x.id===id) : {region:'',country:'',university:'',program:'',degree:'Masters',field:'',scholarship:'',funding:'',eligibility:'',academicReq:'',englishReq:'',research:'',documents:[],deadline:'',source:'',pakEligible:'',myStatus:'',appStatus:'Not Started',tasks:[],notes:'',pinned:false};
  document.getElementById('modalTitle').textContent = id? 'Edit entry' : 'New entry';
  document.getElementById('deleteBtn').style.display = id? 'inline-flex':'none';
  const body=document.getElementById('modalBody'); body.innerHTML='';
  const grid=document.createElement('div'); grid.className='grid2';
  fieldDefs.forEach(([key,type,label])=>{
    const wrap=document.createElement('div'); if(type==='textarea') wrap.style.gridColumn='1 / -1';
    let input='';
    if(type==='select-degree') input=`<select class="f" data-k="${key}"><option>Masters</option><option>PhD</option></select>`;
    else if(type==='select-status') input=`<select class="f" data-k="${key}">${STATUSES.map(s=>`<option>${s}</option>`).join('')}</select>`;
    else if(type==='select-region') input=`<select class="f" data-k="region" id="mRegion"><option value="">Select region…</option>${Object.keys(REGIONS).map(r=>`<option>${r}</option>`).join('')}</select>`;
    else if(type==='select-country') input=`<select class="f" data-k="country" id="mCountry"><option value="">Select country…</option></select>`;
    else if(type==='textarea') input=`<textarea data-k="${key}"></textarea>`;
    else input=`<input type="${type}" data-k="${key}">`;
    wrap.innerHTML=`<label>${label}</label>${input}`; grid.appendChild(wrap);
  });
  body.appendChild(grid);
  fieldDefs.forEach(([key])=>{ const el=body.querySelector(`[data-k="${key}"]`); if(el && key!=='country') el.value=d[key]||''; });
  function fillCountries(region, selected){
    const list = REGIONS[region] || [];
    const cSel=document.getElementById('mCountry');
    cSel.innerHTML='<option value="">Select country…</option>'+list.map(c=>`<option ${c===selected?'selected':''}>${c}</option>`).join('');
  }
  fillCountries(d.region, d.country);
  document.getElementById('mRegion').onchange=(e)=>{ fillCountries(e.target.value, ''); };

  const docWrap=document.createElement('fieldset');
  docWrap.innerHTML=`<legend>Required documents</legend><textarea id="docsField" placeholder="One per line…">${(d.documents||[]).join('\n')}</textarea>`;
  body.appendChild(docWrap);

  const taskWrap=document.createElement('fieldset');
  taskWrap.innerHTML=`<legend>Preparation tasks</legend><div class="tasklist" id="taskList"></div><button type="button" class="btn" id="addTask">${ICON.plus} Add task</button>`;
  body.appendChild(taskWrap);
  let tasks=(d.tasks||[]).map(t=>({...t}));
  function renderTasks(){
    const tl=document.getElementById('taskList');
    tl.innerHTML=tasks.map((t,i)=>`<div class="task-row"><input type="checkbox" data-i="${i}" class="tchk" ${t.done?'checked':''}><input type="text" data-i="${i}" class="ttxt" value="${esc(t.text)}"><button type="button" class="rm" data-i="${i}">${ICON.x}</button></div>`).join('');
    tl.querySelectorAll('.tchk').forEach(c=>c.onchange=()=>{tasks[c.dataset.i].done=c.checked;});
    tl.querySelectorAll('.ttxt').forEach(c=>c.oninput=()=>{tasks[c.dataset.i].text=c.value;});
    tl.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{tasks.splice(b.dataset.i,1);renderTasks();});
  }
  renderTasks();
  document.getElementById('addTask').onclick=()=>{tasks.push({text:'',done:false});renderTasks();};

  document.getElementById('saveBtn').onclick=()=>{
    const out={...d};
    fieldDefs.forEach(([key])=>{ const el=body.querySelector(`[data-k="${key}"]`); out[key]=el.value.trim(); });
    out.documents=document.getElementById('docsField').value.split('\n').map(s=>s.trim()).filter(Boolean);
    out.tasks=tasks.filter(t=>t.text.trim());
    if(!out.university){ toast('University name is required'); return; }
    if(!out.id){ out.id=uid(); out.added=new Date().toISOString(); data.push(out); } else { data[data.findIndex(x=>x.id===out.id)]=out; }
    save(); closeModal(); renderAll(); toast('Entry saved');
  };
  document.getElementById('deleteBtn').onclick=()=>{ if(confirm('Delete this entry permanently?')){ data=data.filter(x=>x.id!==id); save(); closeModal(); renderAll(); toast('Entry deleted'); } };
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }

let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

function exportBackup(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='scholarship-atlas-backup.json';
  document.body.appendChild(a); a.click(); a.remove(); toast('Backup exported');
}
function importBackup(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{ const incoming=JSON.parse(reader.result); if(!Array.isArray(incoming)) throw 0;
      const merge=confirm('Merge with existing entries? Cancel = replace all entries.');
      data = merge? [...data, ...incoming.map(x=>({...x,id:uid()}))] : incoming;
      save(); renderAll(); toast('Backup imported');
    }catch(e){ toast('Invalid backup file'); }
  };
  reader.readAsText(file);
}

document.getElementById('addBtn').onclick=()=>openModal(null);
document.getElementById('closeModal').onclick=closeModal;
document.getElementById('cancelBtn').onclick=closeModal;
document.getElementById('overlay').onclick=(e)=>{ if(e.target.id==='overlay') closeModal(); };
document.getElementById('search').oninput=(e)=>{ state.search=e.target.value; renderTable(); };
document.getElementById('fRegion').onchange=(e)=>{ state.region=e.target.value; state.country=''; renderFilters(); renderTable(); };
document.getElementById('fCountry').onchange=(e)=>{ state.country=e.target.value; renderTable(); };
document.getElementById('fDegree').onchange=(e)=>{ state.degree=e.target.value; renderTable(); };
document.getElementById('fStatus').onchange=(e)=>{ state.status=e.target.value; renderTable(); };
document.getElementById('fSort').onchange=(e)=>{ state.sort=e.target.value; renderTable(); };
document.getElementById('navExport').onclick=exportBackup;
document.getElementById('importFile').onchange=(e)=>{ if(e.target.files[0]) importBackup(e.target.files[0]); e.target.value=''; };
document.getElementById('resetBtn').onclick=()=>{ if(confirm('Erase all tracked entries? This cannot be undone.')){ data=[]; save(); renderAll(); toast('All data cleared'); } };
document.querySelectorAll('.navitem[data-view]').forEach(n=>n.onclick=()=>{
  document.querySelectorAll('.navgroup .navitem').forEach(x=>x.classList.remove('active'));
  n.classList.add('active'); state.view=n.dataset.view; renderTable();
});
document.querySelector('.navgroup .navitem:not([data-view])').onclick=function(){
  document.querySelectorAll('.navgroup .navitem').forEach(x=>x.classList.remove('active'));
  this.classList.add('active'); state.view='all'; renderTable();
};
document.getElementById('railMenu').onclick=()=>document.getElementById('side').classList.toggle('open');
document.getElementById('themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur==='dark'?'light':'dark');
};

renderAll();
</script>
</body>
